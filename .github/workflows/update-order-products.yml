name: Update Order Page Products from Sheet

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-order-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync order page products from Google Sheet
        run: node scripts/update-order-products.mjs

      - name: Commit updated order products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/order-products.json
          git diff --cached --quiet || git commit -m "chore: sync order page products from sheet [skip ci]"
          git pull --rebase origin main
          git push
